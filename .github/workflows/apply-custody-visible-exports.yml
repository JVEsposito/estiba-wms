name: Aplicar custodia visible y exportaciones distribuidas

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/custodia-visible-exportaciones-distribuidas'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Aplicar cambio funcional
        run: python .github/scripts/apply-custody-visible-exports.py

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Formatear PHP
        run: vendor/bin/pint app/Services/Existencias/ServicioExistencias.php tests/Feature/Api/CustodiaDistribuidaMaterialesTest.php tests/Feature/Api/ExistenciasApiTest.php

      - name: Retirar aplicador temporal
        run: rm .github/scripts/apply-custody-visible-exports.py .github/workflows/apply-custody-visible-exports.yml

      - name: Publicar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/Existencias/ServicioExistencias.php resources/views/components/office/navigation.blade.php tests/Feature/Api/CustodiaDistribuidaMaterialesTest.php tests/Feature/Api/ExistenciasApiTest.php .github/scripts/apply-custody-visible-exports.py .github/workflows/apply-custody-visible-exports.yml
          git commit -m "feat: exportar custodia distribuida de materiales"
          git push origin HEAD:${{ github.head_ref }}
