name: Diagnosticar PR 100

on:
  pull_request:
    branches:
      - main

jobs:
  diagnosticar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: estiba_wms_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_DATABASE: estiba_wms_test
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - name: Descargar rama
        uses: actions/checkout@v7
        with:
          ref: agent/navegacion-por-dominios

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ejecutar suite y guardar resumen
        shell: bash
        run: |
          cp .env.example .env
          set +e
          php artisan migrate:fresh --force > /tmp/migracion.log 2>&1
          php artisan test --fail-on-warning > /tmp/tests.log 2>&1
          codigo=$?
          {
            echo "Código: $codigo"
            echo
            tail -n 260 /tmp/tests.log
          } > diagnostico_pr100.txt
          exit 0

      - name: Subir diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-pr100
          path: diagnostico_pr100.txt
          if-no-files-found: error
