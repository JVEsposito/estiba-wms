name: Aplicar núcleo de repaletizajes

on:
  push:
    branches:
      - agent/modulo-repaletizajes
    paths:
      - .github/scripts/apply-repaletizajes-backend.py
      - .github/workflows/apply-repaletizajes-backend.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/apply-repaletizajes-backend.py
      - .github/workflows/apply-repaletizajes-backend.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: estiba_wms_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: estiba_wms_test
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/modulo-repaletizajes
          fetch-depth: 0

      - name: Aplicar cambios
        run: python .github/scripts/apply-repaletizajes-backend.py

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Formatear PHP
        run: vendor/bin/pint app/Models/Repaletizaje.php app/Models/RepaletizajeDetalle.php app/Http/Requests/RegistrarRepaletizajeRequest.php app/Http/Requests/AnularRepaletizajeRequest.php app/Http/Resources/RepaletizajeResource.php app/Http/Resources/RepaletizajeDetalleResource.php app/Services/Validacion/ServicioRepaletizaje.php app/Http/Controllers/Api/RepaletizajeController.php app/Models/Folio.php app/Services/Autorizacion/CatalogoModulosAcceso.php app/Services/Autorizacion/AlcanceOperacionalUsuario.php app/Providers/AppServiceProvider.php routes/api.php tests/Feature/Api/RepaletizajeApiTest.php database/migrations/2026_08_06_124500_crear_modulo_repaletizajes.php

      - name: Crear esquema
        run: php artisan migrate:fresh --force

      - name: Ejecutar regresiones
        run: php artisan test tests/Feature/Api/RepaletizajeApiTest.php

      - name: Retirar aplicador
        run: rm .github/scripts/apply-repaletizajes-backend.py

      - name: Publicar núcleo
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app database/migrations/2026_08_06_124500_crear_modulo_repaletizajes.php routes/api.php tests/Feature/Api/RepaletizajeApiTest.php .github/scripts/apply-repaletizajes-backend.py
          git commit -m "feat(validacion): incorporar núcleo de repaletizajes"
          git push origin HEAD:agent/modulo-repaletizajes
