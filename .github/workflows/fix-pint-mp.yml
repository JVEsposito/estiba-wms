name: Corregir formato MP

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  corregir:
    if: github.head_ref == 'agent/ajustar-calibre-cuartel-lotes-mp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Ordenar imports
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/Http/Controllers/Api/MateriaPrimaController.php')
          text = path.read_text()
          old = "use App\\Http\\Requests\\CompletarHidrocoolerMateriaPrimaRequest;\nuse App\\Http\\Requests\\CorregirOrigenLoteMateriaPrimaRequest;\nuse App\\Http\\Requests\\ConfirmarLoteMateriaPrimaRequest;"
          new = "use App\\Http\\Requests\\CompletarHidrocoolerMateriaPrimaRequest;\nuse App\\Http\\Requests\\ConfirmarLoteMateriaPrimaRequest;\nuse App\\Http\\Requests\\CorregirOrigenLoteMateriaPrimaRequest;"
          if old not in text:
              raise SystemExit('El patrón de imports ya no coincide.')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/Api/MateriaPrimaController.php
          git commit -m "style: ordenar imports de materia prima"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
