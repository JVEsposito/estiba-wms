name: Aplicar corrección backend PR 178

on:
  push:
    branches:
      - agent/retornos-packing-multiorigen
    paths:
      - .github/scripts/apply-pr178-backend-review.py
      - .github/workflows/apply-pr178-backend-review.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: estiba_wms_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: estiba_wms_test
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/retornos-packing-multiorigen
          fetch-depth: 0

      - name: Aplicar correcciones
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-pr178-backend-review.py')
          content = path.read_text().replace(
              'TipoResultadoPacking::query()',
              r'\App\Models\TipoResultadoPacking::query()',
          )
          path.write_text(content)
          PY
          python .github/scripts/apply-pr178-backend-review.py

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Formatear PHP
        run: vendor/bin/pint app/Services/MateriaPrima/ServicioRetornoPacking.php app/Http/Controllers/Api/FrutaProcesoController.php app/Http/Resources/FrutaProcesoLoteResource.php tests/Feature/Api/MateriaPrimaApiTest.php

      - name: Crear esquema limpio
        run: php artisan migrate:fresh --force

      - name: Ejecutar regresiones de materia prima
        run: php artisan test tests/Feature/Api/MateriaPrimaApiTest.php

      - name: Retirar aplicador temporal
        run: rm .github/scripts/apply-pr178-backend-review.py

      - name: Publicar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/MateriaPrima/ServicioRetornoPacking.php app/Http/Controllers/Api/FrutaProcesoController.php app/Http/Resources/FrutaProcesoLoteResource.php tests/Feature/Api/MateriaPrimaApiTest.php .github/scripts/apply-pr178-backend-review.py
          git commit -m "fix(materia-prima): completar retornos multiorigen"
          git push origin HEAD:agent/retornos-packing-multiorigen
