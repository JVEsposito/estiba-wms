name: Aplicar interfaz multiorigen PR 178

on:
  push:
    branches:
      - agent/retornos-packing-multiorigen
    paths:
      - .github/scripts/apply-pr178-ui-review.py
      - .github/workflows/apply-pr178-ui-review.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/retornos-packing-multiorigen
          fetch-depth: 0

      - name: Aplicar correcciones
        run: python .github/scripts/apply-pr178-ui-review.py

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias web
        run: npm ci

      - name: Validar JavaScript
        run: node --check resources/js/office-raw-material-process.js

      - name: Compilar oficina
        run: npm run build

      - name: Instalar dependencias móviles
        working-directory: mobile
        run: npm ci

      - name: Validar TypeScript móvil
        working-directory: mobile
        run: npm run typecheck

      - name: Retirar aplicador temporal
        run: rm .github/scripts/apply-pr178-ui-review.py

      - name: Publicar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/office/raw-material-process.blade.php resources/js/office-raw-material-process.js resources/css/office-raw-material-process.css mobile/src/domain/frutaProceso.ts mobile/src/screens/FrutaProcesoScreen.tsx .github/scripts/apply-pr178-ui-review.py
          git commit -m "feat(materia-prima): operar retornos multiorigen en interfaces"
          git push origin HEAD:agent/retornos-packing-multiorigen
