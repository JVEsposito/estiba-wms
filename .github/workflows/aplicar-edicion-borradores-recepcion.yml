name: Aplicar edición de borradores de recepción

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de corrección
        uses: actions/checkout@v7
        with:
          ref: agent/editar-borradores-recepcion-materiales
          fetch-depth: 0

      - name: Aplicar corrección
        id: aplicar
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/aplicar_edicion_borradores_recepcion.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          corrected = False
          for index, line in enumerate(lines):
              if not corrected and 'onBack={() => setSelected(null)}' in line:
                  position = line.index('onBack')
                  if position == 0 or not line[position - 1].isspace():
                      raise RuntimeError('El patrón onBack no posee espacio ajustable.')
                  lines[index] = line[:position - 1] + line[position:]
                  next_line = lines[index + 1]
                  next_position = next_line.index('onConfirm')
                  lines[index + 1] = next_line[:next_position - 1] + next_line[next_position:]
                  corrected = True
          if not corrected:
              raise RuntimeError('No se encontró el primer patrón onBack/onConfirm.')
          path.write_text(''.join(lines), encoding='utf-8')
          PY
          python3 tools/aplicar_edicion_borradores_recepcion.py > /tmp/aplicador.log 2>&1
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          if [ "$codigo" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/aplicador.log tools/error_aplicador.txt
          fi
          exit 0

      - name: Publicar diagnóstico
        if: steps.aplicar.outputs.codigo != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/error_aplicador.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: registrar error del aplicador"
          git push origin HEAD:agent/editar-borradores-recepcion-materiales

      - name: Retirar herramientas temporales
        if: steps.aplicar.outputs.codigo == '0'
        run: |
          rm tools/aplicar_edicion_borradores_recepcion.py
          rm tools/.activar_edicion_borradores
          rm .github/workflows/aplicar-edicion-borradores-recepcion.yml
          rm -f tools/error_aplicador.txt

      - name: Publicar cambios funcionales
        if: steps.aplicar.outputs.codigo == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: permitir editar borradores de recepción"
          git push origin HEAD:agent/editar-borradores-recepcion-materiales
