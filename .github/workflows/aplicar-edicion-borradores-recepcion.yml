name: Aplicar edición de borradores de recepción

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de corrección
        uses: actions/checkout@v7
        with:
          ref: agent/editar-borradores-recepcion-materiales
          fetch-depth: 0

      - name: Aplicar corrección
        id: aplicar
        shell: bash
        run: |
          set +e
          python3 tools/aplicar_edicion_borradores_recepcion.py > /tmp/aplicador.log 2>&1
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          if [ "$codigo" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/aplicador.log tools/error_aplicador.txt
          fi
          exit 0

      - name: Publicar diagnóstico
        if: steps.aplicar.outputs.codigo != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/error_aplicador.txt
          git commit -m "chore: registrar error del aplicador"
          git push origin HEAD:agent/editar-borradores-recepcion-materiales

      - name: Retirar herramientas temporales
        if: steps.aplicar.outputs.codigo == '0'
        run: |
          rm tools/aplicar_edicion_borradores_recepcion.py
          rm tools/.activar_edicion_borradores
          rm .github/workflows/aplicar-edicion-borradores-recepcion.yml
          rm -f tools/error_aplicador.txt

      - name: Publicar cambios funcionales
        if: steps.aplicar.outputs.codigo == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: permitir editar borradores de recepción"
          git push origin HEAD:agent/editar-borradores-recepcion-materiales
