name: Ejecutar ajuste lotes MP

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    if: github.head_ref == 'agent/ajustar-calibre-cuartel-lotes-mp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Aplicar cambios
        shell: bash
        run: |
          if [ -f database/migrations/2026_07_30_170000_hacer_calibre_y_cuartel_opcionales_en_lotes_mp.php ]; then
            echo "Cambios ya aplicados."
            exit 0
          fi
          python3 .github/scripts/apply-mp-adjustment.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app routes resources database tests
          git commit -m "fix: ajustar calibre y cuartel en lotes de materia prima"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
