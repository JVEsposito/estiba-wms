name: Diagnóstico existencias

on:
  pull_request:

jobs:
  existencias:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: estiba_wms_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: estiba_wms_test
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Crear esquema limpio
        run: php artisan migrate:fresh --force

      - name: Ejecutar suite con reporte
        id: pruebas
        shell: bash
        run: |
          set +e
          php artisan test --fail-on-warning --log-junit resultados-existencias.xml
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar resultado
        uses: actions/upload-artifact@v4
        with:
          name: resultados-existencias
          path: resultados-existencias.xml
          if-no-files-found: error

      - name: Propagar resultado
        run: exit "${{ steps.pruebas.outputs.codigo }}"
