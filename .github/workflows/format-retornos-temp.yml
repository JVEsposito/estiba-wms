name: Formatear retorno temporal

on:
  push:
    branches:
      - agent/retornos-packing-por-bin

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          ref: agent/retornos-packing-por-bin
      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip
          coverage: none
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Aplicar Pint y publicar si cambia
        run: |
          vendor/bin/pint app/Services/MateriaPrima/ServicioBinRetornoPacking.php
          if ! git diff --quiet -- app/Services/MateriaPrima/ServicioBinRetornoPacking.php; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/Services/MateriaPrima/ServicioBinRetornoPacking.php
            git commit -m "style(retornos): aplicar Pint al servicio por bin"
            git push origin HEAD:agent/retornos-packing-por-bin
          fi
