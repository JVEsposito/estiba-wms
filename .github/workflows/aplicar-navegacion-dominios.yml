name: Aplicar navegación por dominios

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v7
        with:
          ref: agent/navegacion-por-dominios
          fetch-depth: 0

      - name: Aplicar rediseño
        run: python3 tools/aplicar_navegacion_dominios.py

      - name: Retirar herramientas temporales
        run: |
          rm tools/aplicar_navegacion_dominios.py
          rm .github/workflows/aplicar-navegacion-dominios.yml

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: reorganizar oficinas por dominios"
          git push origin HEAD:agent/navegacion-por-dominios
