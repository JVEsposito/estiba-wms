name: Aplicar navegación por dominios

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v7
        with:
          ref: agent/navegacion-por-dominios
          fetch-depth: 0

      - name: Aplicar rediseño
        id: aplicar
        shell: bash
        run: |
          set +e
          python3 tools/aplicar_navegacion_dominios.py > /tmp/aplicador.log 2>&1
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          if [ "$codigo" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/aplicador.log tools/error_navegacion_dominios.txt
          fi
          exit 0

      - name: Publicar diagnóstico
        if: steps.aplicar.outputs.codigo != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/error_navegacion_dominios.txt
          git commit -m "chore: registrar error del aplicador de navegación" || true
          git push origin HEAD:agent/navegacion-por-dominios

      - name: Retirar herramientas temporales
        if: steps.aplicar.outputs.codigo == '0'
        run: |
          rm tools/aplicar_navegacion_dominios.py
          rm .github/workflows/aplicar-navegacion-dominios.yml
          rm -f tools/error_navegacion_dominios.txt

      - name: Publicar cambios
        if: steps.aplicar.outputs.codigo == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982982+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: reorganizar oficinas por dominios"
          git push origin HEAD:agent/navegacion-por-dominios
