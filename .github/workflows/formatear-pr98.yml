name: Formatear PR 98

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  formatear:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v7
        with:
          ref: agent/editar-borradores-recepcion-materiales
          fetch-depth: 0

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Formatear archivos PHP modificados
        run: |
          vendor/bin/pint \
            app/Http/Controllers/Api/RecepcionMaterialController.php \
            app/Http/Requests/ActualizarRecepcionMaterialRequest.php \
            app/Models/BultoRecepcionMaterial.php \
            app/Models/DetalleRecepcionMaterial.php \
            app/Services/Materiales/ServicioRecepcionMaterial.php \
            database/migrations/2026_07_27_230000_habilitar_edicion_borradores_recepciones_materiales.php \
            routes/api.php \
            tests/Feature/Api/RecepcionMaterialApiTest.php

      - name: Retirar workflow temporal
        run: rm .github/workflows/formatear-pr98.yml

      - name: Publicar formato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: formatear edición de borradores"
          git push origin HEAD:agent/editar-borradores-recepcion-materiales
