name: Aplicar disponibilidad de materiales por cámara

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/materiales-disponibles-solo-camara'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar cambio funcional
        run: |
          python .github/scripts/apply-camera-only-1.py
          python .github/scripts/apply-camera-only-2.py
          python .github/scripts/apply-camera-only-3.py
          python .github/scripts/apply-camera-only-4.py

      - name: Publicar cambio
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Sin cambios pendientes'
            exit 0
          fi
          git commit -m 'feat: permitir materiales disponibles solo con cámara'
          git push origin HEAD:${{ github.head_ref }}
